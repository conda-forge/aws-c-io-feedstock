schema_version: 1

context:
  version: "0.27.7"

package:
  name: aws-c-io
  version: ${{ version }}

source:
  url: https://github.com/awslabs/aws-c-io/archive/v${{ version }}.tar.gz
  sha256: cc84b1639c64af41ec7ea7397b020483f9bf73e3b07a72b16b4051b421079aa5

build:
  number: 2

requirements:
  build:
    - cmake !=3.19.0,!=3.19.1
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ninja
    - if: win
      then: python
  host:
    - aws-c-common
    - aws-c-cal
    - if: unix
      then: s2n
  run_exports:
    - ${{ pin_subpackage("aws-c-io", upper_bound="x.x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-io${SHLIB_EXT}
          - test -f $PREFIX/include/aws/io/io.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\io\\io.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-io.dll exit 1
  - if: win and arm64
    then:
      requirements:
        run:
          - ${{ compiler('c') }}
          - cmake
      files:
        recipe:
          - CMakeLists.txt
          - consumer.c
      script:
        - cmake -S . -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
        - cmake --build consumer-build
        - consumer-build\aws_io_consumer.exe
        - dumpbin /headers "%LIBRARY_BIN%\aws-c-io.dll" | findstr /I /C:"AA64 machine (ARM64)"
        - dumpbin /headers consumer-build\aws_io_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: This is a module for the AWS SDK for C. It handles all IO and TLS work for application protocols.
  homepage: https://github.com/awslabs/aws-c-io
  repository: https://github.com/awslabs/aws-c-io

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
